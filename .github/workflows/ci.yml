name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions > CI > Run workflow: redeploy main, or roll back to an image that CI already published.
  workflow_dispatch:
    inputs:
      tag:
        description: "Commit SHA of a published image to deploy (empty = build and deploy main)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # A rollback reuses an image that already passed this job.
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://radar:radar@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx next build

  # Every push to main that passes tests ships to the VPS; so does a manual run on main.
  deploy:
    needs: test
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://apps.giovaniohira.com/radar
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/giovaniohira
      TAG: ${{ inputs.tag || github.sha }}
      PUBLIC_URL: https://apps.giovaniohira.com/radar
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the rollback image exists
        if: inputs.tag != ''
        run: |
          docker buildx imagetools inspect "$REGISTRY/radar-licitacoes-web:$TAG" >/dev/null
          docker buildx imagetools inspect "$REGISTRY/radar-licitacoes-jobs:$TAG" >/dev/null

      - name: Build and push web
        if: inputs.tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: BASE_PATH=/radar
          push: true
          tags: ${{ env.REGISTRY }}/radar-licitacoes-web:${{ env.TAG }},${{ env.REGISTRY }}/radar-licitacoes-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push jobs
        if: inputs.tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: jobs
          push: true
          tags: ${{ env.REGISTRY }}/radar-licitacoes-jobs:${{ env.TAG }},${{ env.REGISTRY }}/radar-licitacoes-jobs:latest
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,mode=max,scope=jobs

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key radar@$SSH_HOST"
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml "radar@$SSH_HOST:/opt/radar/docker-compose.yml"
          $SSH "echo '$GHCR_TOKEN' | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null"
          $SSH "cd /opt/radar && IMAGE_TAG=$TAG docker compose pull -q && IMAGE_TAG=$TAG docker compose up -d --remove-orphans"
          # Only remove this app's older images; the VPS is shared, so never prune globally.
          $SSH "docker logout ghcr.io >/dev/null; docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/giovaniohira/radar-licitacoes-' | grep -v -e ':$TAG\$' -e ':latest\$' | xargs -r docker rmi >/dev/null 2>&1 || true"
          # Smoke test through the container port (nginx is not involved).
          for _ in $(seq 1 20); do
            if $SSH "curl -fsS -o /dev/null http://127.0.0.1:3200/radar"; then echo "deployed $TAG"; exit 0; fi
            sleep 3
          done
          $SSH "cd /opt/radar && docker compose logs --tail 50 web"
          exit 1

      - name: Smoke test the public URL
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS -o /dev/null "$PUBLIC_URL" && curl -fsS -o /dev/null "$PUBLIC_URL/buscar?q=notebook"; then
              echo "### Deployed \`$TAG\` to $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          exit 1
