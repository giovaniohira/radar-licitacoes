# /etc/nginx/snippets/radar.conf, included inside the apps.giovaniohira.com server block (443).
# The app moved to https://vencedital.com.br on 21/11/2026; keep this redirect for at least 12 months:
# calendar feeds (pipeline.ics?u=&t=) and login links (/entrar/confirmar?token=) are fetched outside a browser.
# The rewrite drops the /radar prefix and keeps the query string. ^~ keeps the site's static-asset regex
# location from catching /radar/_next/*.
location = /radar   { return 301 https://vencedital.com.br/$is_args$args; }
location ^~ /radar/ { rewrite ^/radar/(.*)$ https://vencedital.com.br/$1 permanent; }
