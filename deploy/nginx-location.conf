# Included inside the apps.giovaniohira.com server block (443).
# ^~ keeps the site's static-asset regex location from catching /radar/_next/*.js.
location ^~ /radar {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off; # streamed RSC responses
    proxy_read_timeout 120s; # AI summaries can take ~1 min
}
