# /etc/nginx/sites-available/vencedital.com.br, linked from sites-enabled.
# Certificate: certbot certonly --webroot -w /var/www/vencedital.com.br -d vencedital.com.br -d www.vencedital.com.br
#   --deploy-hook "systemctl reload nginx"   (webroot: issuing and renewing never edit this file)
# HTTP/2 is on for the whole 443 socket (nginx 1.24 has no "http2 on;" yet), so it also serves the other sites on this IP.
# Access log has its own directory and rotation (deploy/logrotate-vencedital): the Privacy Policy keeps
# access records for 6 months (Marco Civil art. 15), longer than the host's default 14 days.

server {
    listen 80;
    listen [::]:80;
    server_name vencedital.com.br www.vencedital.com.br;
    access_log /var/log/nginx-vencedital/access.log;
    location /.well-known/acme-challenge/ { root /var/www/vencedital.com.br; }
    location / { return 301 https://vencedital.com.br$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vencedital.com.br;
    access_log /var/log/nginx-vencedital/access.log;
    ssl_certificate /etc/letsencrypt/live/vencedital.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vencedital.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vencedital.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vencedital.com.br;
    access_log /var/log/nginx-vencedital/access.log;
    ssl_certificate /etc/letsencrypt/live/vencedital.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vencedital.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Short HSTS while the domain is new; raise to 31536000 once it has run without issues.
    add_header Strict-Transport-Security "max-age=300" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off; # streamed RSC responses
        proxy_read_timeout 120s; # AI summaries can take ~1 min
    }
}
